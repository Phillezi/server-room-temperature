{{- if .Values.nats.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-nats-config
  labels:
    {{- include "server-room.natsLabels" . | nindent 4 }}
data:
  nats.conf: |
    server_name: {{ .Values.nats.serverName | quote }}

    port: {{ .Values.nats.port }}

    {{- if .Values.nats.monitoring.enabled }}
    http_port: {{ .Values.nats.monitoring.port }}
    {{- end }}

    {{- if .Values.nats.jetstream.enabled }}
    jetstream {
      store_dir: {{ .Values.nats.jetstream.storeDir | quote }}
    }
    {{- end }}

    {{- if .Values.nats.websocket.enabled }}
    websocket {
      port: {{ .Values.nats.websocket.port }}
      no_tls: {{ .Values.nats.websocket.noTLS }}
    }
    {{- end }}

    {{- if .Values.nats.authorization.enabled }}
    authorization {
      users = [
        {{- range $i, $user := .Values.nats.authorization.users }}
        {
          user: {{ $user.user | quote }}
          password: $NATS_USER_PASSWORD_{{ $i }}
          permissions = {
            {{- if $user.permissions.publish }}
            publish = [{{ range $j, $p := $user.permissions.publish }}{{ if $j }}, {{ end }}{{ $p | quote }}{{ end }}]
            {{- else }}
            publish = []
            {{- end }}
            {{- if $user.permissions.subscribe }}
            subscribe = [{{ range $j, $s := $user.permissions.subscribe }}{{ if $j }}, {{ end }}{{ $s | quote }}{{ end }}]
            {{- else }}
            subscribe = []
            {{- end }}
          }
        }
        {{- end }}
      ]
    }
    {{- end }}

    {{- with .Values.nats.extraConfig }}
    {{ . | nindent 4 }}
    {{- end }}
{{- end }}
