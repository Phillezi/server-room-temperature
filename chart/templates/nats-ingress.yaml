{{- if and .Values.nats.enabled .Values.nats.websocket.enabled .Values.nats.websocket.ingress.enabled }}
{{- $defaultAnnotations := dict "nginx.ingress.kubernetes.io/proxy-read-timeout" "3600" "nginx.ingress.kubernetes.io/proxy-send-timeout" "3600" "nginx.ingress.kubernetes.io/proxy-http-version" "1.1" }}
{{- $annotations := merge (dict) (.Values.nats.websocket.ingress.annotations | default dict) $defaultAnnotations }}
{{- if .Values.nats.websocket.ingress.clusterIssuer }}
  {{- $_ := set $annotations "cert-manager.io/cluster-issuer" .Values.nats.websocket.ingress.clusterIssuer }}
{{- end }}
{{- if .Values.nats.websocket.ingress.issuer }}
  {{- $_ := set $annotations "cert-manager.io/issuer" .Values.nats.websocket.ingress.issuer }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-nats-ws
  labels:
    {{- include "server-room.natsLabels" . | nindent 4 }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.nats.websocket.ingress.className }}
  ingressClassName: {{ .Values.nats.websocket.ingress.className }}
  {{- end }}
  {{- if .Values.nats.websocket.ingress.tls }}
  tls:
    {{- range .Values.nats.websocket.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.nats.websocket.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- $paths := .paths | default (list (dict "path" "/" "pathType" "Prefix")) }}
          {{- range $paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ $.Release.Name }}-nats
                port:
                  number: {{ $.Values.nats.websocket.port }}
          {{- end }}
    {{- end }}
{{- end }}
