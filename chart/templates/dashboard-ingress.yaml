{{- if and .Values.dashboard.enabled .Values.dashboard.ingress.enabled }}
{{- $annotations := merge (dict) (.Values.dashboard.ingress.annotations | default dict) }}
{{- if .Values.dashboard.ingress.clusterIssuer }}
  {{- $_ := set $annotations "cert-manager.io/cluster-issuer" .Values.dashboard.ingress.clusterIssuer }}
{{- end }}
{{- if .Values.dashboard.ingress.issuer }}
  {{- $_ := set $annotations "cert-manager.io/issuer" .Values.dashboard.ingress.issuer }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-dashboard
  labels:
    {{- include "server-room.dashboardLabels" . | nindent 4 }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.dashboard.ingress.className }}
  ingressClassName: {{ .Values.dashboard.ingress.className }}
  {{- end }}
  {{- if .Values.dashboard.ingress.tls }}
  tls:
    {{- range .Values.dashboard.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.dashboard.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- $paths := .paths | default (list (dict "path" "/" "pathType" "Prefix")) }}
          {{- range $paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ $.Release.Name }}-dashboard
                port:
                  number: {{ $.Values.dashboard.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
