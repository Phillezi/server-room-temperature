{{- if .Values.dashboard.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-dashboard
  labels:
    {{- include "server-room.dashboardLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.dashboard.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "server-room.dashboardSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "server-room.dashboardSelectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: dashboard
        {{- with .Values.dashboard.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.dashboard.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      containers:
        - name: dashboard
          image: "{{ .Values.dashboard.image.repository }}:{{ .Values.dashboard.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.dashboard.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: {{ .Values.dashboard.service.targetPort | default 8080 }}
              protocol: TCP
          env:
            - name: NATS_HOST
              value: {{ .Values.dashboard.nats.host | default (printf "%s-nats:%d" .Release.Name (.Values.nats.port | int)) | quote }}
            - name: NATS_USER
              value: {{ .Values.dashboard.nats.user | default "temperature-dashboard" | quote }}
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.nats.authorization.existingSecret | default (printf "%s-nats-auth" .Release.Name) }}
                  key: NATS_USER_PASSWORD_{{ .Values.dashboard.nats.userIndex | default 2 }}
            - name: STREAM_NAME
              value: {{ .Values.init.stream.name | quote }}
            - name: HTTP_ADDR
              value: ":{{ .Values.dashboard.service.targetPort | default 8080 }}"
            {{- $wsURL := .Values.dashboard.client.wsURL }}
            {{- if and (not $wsURL) .Values.nats.websocket.ingress.enabled .Values.nats.websocket.ingress.hosts }}
              {{- $firstHost := (index .Values.nats.websocket.ingress.hosts 0).host }}
              {{- $scheme := "ws" }}
              {{- if or .Values.nats.websocket.ingress.tls .Values.nats.websocket.ingress.clusterIssuer .Values.nats.websocket.ingress.issuer (hasKey (.Values.nats.websocket.ingress.annotations | default dict) "cert-manager.io/cluster-issuer") (hasKey (.Values.nats.websocket.ingress.annotations | default dict) "cert-manager.io/issuer") }}
                {{- $scheme = "wss" }}
              {{- end }}
              {{- $wsURL = printf "%s://%s" $scheme $firstHost }}
            {{- end }}
            - name: NATS_WS_URL
              value: {{ $wsURL | quote }}
            - name: NATS_READER_USER
              value: {{ .Values.dashboard.client.readerUser | default "temperature-reader" | quote }}
            - name: NATS_READER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.nats.authorization.existingSecret | default (printf "%s-nats-auth" .Release.Name) }}
                  key: NATS_USER_PASSWORD_{{ .Values.dashboard.client.readerUserIndex | default 1 }}
            - name: NATS_SUBJECT
              value: {{ .Values.dashboard.client.subject | default "serverroom.temperature.room1.sensor1" | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
      {{- with .Values.global.imagePullSecrets | default .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      {{- with .Values.dashboard.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dashboard.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dashboard.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
